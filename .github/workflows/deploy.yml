name: Deploy to Pages Branch

on:
  # 在 Build and Check 成功完成后再部署，避免与 CI 重复构建
  workflow_run:
    workflows: [ "Build and Check" ]
    types: [ completed ]
    branches: [ main ]
  # 允许你在 GitHub 上的 Actions 标签中手动触发此"工作流程"
  workflow_dispatch:

# 部署串行化：不取消正在进行的部署，只保证不并发
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

# 需要写入权限来推送到pages分支
permissions:
  contents: write
  actions: read

jobs:
  build-and-deploy:
    # 只有上游构建成功（或手动触发）时才部署
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_run 事件默认检出的是默认分支的 HEAD，这里锁定到触发构建的那个 commit
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: pages # 部署到pages分支
          folder: dist # Astro默认构建输出目录
          clean: true # 清理目标分支中的旧文件
